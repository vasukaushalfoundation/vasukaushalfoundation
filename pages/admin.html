<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VKF Admin Dashboard</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f6f9;
}

.header{
background:#800000;
color:white;
padding:15px 25px;
font-size:20px;
}

.dashboard{
display:flex;
gap:20px;
padding:20px;
}

.card{
flex:1;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
text-align:center;
}

.card h2{
margin:0;
color:#800000;
}

.filters{
padding:0 20px 20px 20px;
}

input,select{
padding:8px;
margin-right:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ccc;
padding:6px;
font-size:13px;
}

th{
background:#800000;
color:white;
}

</style>
</head>

<body>

<script>
let pass = prompt("Enter Admin Password");

if(pass !== "VKF2026"){
document.body.innerHTML="<h2 style='color:red;text-align:center;margin-top:50px;'>Access Denied</h2>";
}
</script>

<div class="header">
Vasu Kaushal Foundation - Jain Census Admin
</div>

<div class="dashboard">
<div class="card">
<h3>Total Families</h3>
<h2 id="familyCount">0</h2>
</div>

<div class="card">
<h3>Total Members</h3>
<h2 id="memberCount">0</h2>
</div>

<div class="card">
<h3>Total Districts</h3>
<h2 id="districtCount">0</h2>
</div>
</div>

<div class="filters">
<input type="text" id="searchBox" placeholder="Search by Name" onkeyup="applyFilters()">

<select id="districtFilter" onchange="applyFilters()">
<option value="">All Districts</option>
</select>
</div>

<div id="tableContainer" style="padding:20px;"></div>

<script>

let rawData=[];
let familyData={};

fetch("https://script.google.com/macros/s/AKfycbykJHnlG-TazPHuhPF_0IOOy5sV_CeIut0QT9wUQ_REf0Mw-Q_iKo6yIZBdh5TRIqW23A/exec")
.then(res=>res.json())
.then(data=>{
rawData=data;
groupFamilies(data);
populateDistricts(data);
updateDashboard();
renderTable();
});

function groupFamilies(data){

familyData={};

data.forEach(row=>{

let fam=row["3"] || row["familyId"] || row["Family ID"] || row["familyId"];

let familyId=row[Object.keys(row)[2]];

if(!familyData[familyId]){
familyData[familyId]={
district:row[Object.keys(row)[12]],
members:[]
};
}

familyData[familyId].members.push(row);

});

}

function updateDashboard(){

document.getElementById("familyCount").innerText=
Object.keys(familyData).length;

document.getElementById("memberCount").innerText=
rawData.length;

let districts=new Set();
rawData.forEach(r=>{
districts.add(r[Object.keys(r)[12]]);
});

document.getElementById("districtCount").innerText=districts.size;

}

function populateDistricts(data){

let districts=new Set();

data.forEach(r=>{
districts.add(r[Object.keys(r)[12]]);
});

let select=document.getElementById("districtFilter");

districts.forEach(d=>{
let opt=document.createElement("option");
opt.value=d;
opt.textContent=d;
select.appendChild(opt);
});

}

function applyFilters(){

let search=document.getElementById("searchBox").value.toLowerCase();
let district=document.getElementById("districtFilter").value;

let filtered=rawData.filter(r=>{

let name=r[Object.keys(r)[4]].toLowerCase();
let dist=r[Object.keys(r)[12]];

return (name.includes(search)) &&
(district==="" || dist===district);

});

renderTable(filtered);

}

function renderTable(data=rawData){

let html="<table><tr>";

Object.keys(rawData[0]).forEach(key=>{
html+="<th>"+key+"</th>";
});

html+="</tr>";

data.forEach(row=>{
html+="<tr>";
Object.values(row).forEach(val=>{
html+="<td>"+val+"</td>";
});
html+="</tr>";
});

html+="</table>";

document.getElementById("tableContainer").innerHTML=html;

}

</script>

</body>
</html>
