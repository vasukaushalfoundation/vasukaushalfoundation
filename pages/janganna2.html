<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>जैन जनगणना प्रपत्र 2026</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f5f1e6; padding:20px;}
.container { max-width:950px; margin:auto; background:white; padding:25px; border-radius:10px;}
h1 { text-align:center; color:#8B0000; }

input, select, textarea {
  width:100%;
  padding:8px;
  margin:6px 0;
}

button {
  background:#8B0000;
  color:white;
  padding:10px;
  border:none;
  cursor:pointer;
  margin-top:8px;
}

.member-block {
  border:1px solid #ccc;
  padding:15px;
  margin-bottom:15px;
  border-radius:6px;
  background:#fafafa;
  position:relative;
}

.remove-btn {
  background:red;
  position:absolute;
  right:10px;
  top:10px;
  padding:5px 8px;
  font-size:12px;
}

.member-title {
  font-weight:bold;
  margin-bottom:10px;
}

.note-box {
  background:#fff3cd;
  padding:10px;
  border-radius:6px;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="container">

<h1>जैन जनगणना प्रपत्र 2026</h1>

<form id="familyForm">

<label>संप्रदाय</label>
<select id="sampraday" required>
<option value="">-- चयन करें --</option>
<option>दिगम्बर</option>
<option>श्वेताम्बर</option>
</select>

<label>सरनेम में जैन लिखते हैं?</label>
<select id="jainSurname">
<option value="">-- चयन करें --</option>
<option>हाँ</option>
<option>नहीं</option>
</select>

<label>गोत्र</label>
<input type="text" id="gotra">

<label>पता</label>
<textarea id="address"></textarea>

<label>जिला</label>
<input type="text" id="district">

<label>राज्य</label>
<input type="text" id="state">

<label>ईमेल</label>
<input type="email" id="email">

<label>सदस्यता</label>
<select id="membership">
<option value="">-- चयन करें --</option>
<option>हाँ</option>
<option>नहीं</option>
</select>

<label>दान सहयोग</label>
<select id="donationSelect">
<option value="">-- चयन करें --</option>
<option>हाँ</option>
<option>अभी नहीं</option>
</select>

<h3>परिवार सदस्य विवरण</h3>

<div class="note-box">
📌 परिवार के अन्य सदस्यों को जोड़ने के लिए “+ सदस्य जोड़ें” पर क्लिक करें।
</div>

<div id="members"></div>

<button type="button" onclick="addMember()">+ सदस्य जोड़ें</button>

<button type="submit">प्रपत्र जमा करें</button>

</form>

</div>

<script>

let memberCount = 0;

function addMember(){

  memberCount++;

  var container = document.getElementById("members");

  var div = document.createElement("div");
  div.className = "member-block";

  div.innerHTML = `
    <div class="member-title">सदस्य ${memberCount}</div>
    <button type="button" class="remove-btn" onclick="removeMember(this)">X</button>

    <label>नाम</label>
    <input class="m_name" required>

    <label>पिता/पति</label>
    <input class="m_father">

    <label>लिंग</label>
    <select class="m_gender">
      <option value="">-- चयन करें --</option>
      <option>पुरुष</option>
      <option>महिला</option>
      <option>अन्य</option>
    </select>

    <label>जन्मतिथि</label>
    <input type="date" class="m_dob">

    <label>वैवाहिक स्थिति</label>
    <select class="m_marital">
      <option value="">-- चयन करें --</option>
      <option>अविवाहित</option>
      <option>विवाहित</option>
      <option>विधुर / विधवा</option>
      <option>तलाकशुदा</option>
    </select>

    <label>व्यवसाय</label>
    <input class="m_occupation">

    <label>अन्य व्यवसाय</label>
    <input class="m_otherOccupation">

    <label>शिक्षा</label>
    <input class="m_education">

    <label>मोबाइल</label>
    <input class="m_mobile" required>
  `;

  container.appendChild(div);
}

function removeMember(btn){
  btn.parentElement.remove();
  updateNumbering();
}

function updateNumbering(){
  memberCount = 0;
  document.querySelectorAll(".member-block").forEach(function(block){
    memberCount++;
    block.querySelector(".member-title").innerText = "सदस्य " + memberCount;
  });
}

window.onload = function(){
  addMember();
};

document.getElementById("familyForm").addEventListener("submit", function(e){

  e.preventDefault();

  let membersArray = [];

  document.querySelectorAll(".member-block").forEach(function(block){

    membersArray.push({
      name: block.querySelector(".m_name").value,
      father: block.querySelector(".m_father").value,
      gender: block.querySelector(".m_gender").value,
      dob: block.querySelector(".m_dob").value,
      marital: block.querySelector(".m_marital").value,
      occupation: block.querySelector(".m_occupation").value,
      otherOccupation: block.querySelector(".m_otherOccupation").value,
      education: block.querySelector(".m_education").value,
      mobile: block.querySelector(".m_mobile").value
    });

  });

  fetch("https://script.google.com/macros/s/AKfycbykJHnlG-TazPHuhPF_0IOOy5sV_CeIut0QT9wUQ_REf0Mw-Q_iKo6yIZBdh5TRIqW23A/exec", {
    method: "POST",
    body: JSON.stringify({
      sampraday: document.getElementById("sampraday").value,
      jainSurname: document.getElementById("jainSurname").value,
      gotra: document.getElementById("gotra").value,
      address: document.getElementById("address").value,
      district: document.getElementById("district").value,
      state: document.getElementById("state").value,
      email: document.getElementById("email").value,
      membership: document.getElementById("membership").value,
      donation: document.getElementById("donationSelect").value,
      source: "Online Website",
      representative: "Vasu Kaushal Foundation",
      members: membersArray
    })
  });

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 10;
  doc.text("जैन जनगणना प्रपत्र 2026", 10, y);
  y += 10;

  membersArray.forEach(function(member, index){
    doc.text("सदस्य " + (index+1) + " - " + member.name, 10, y);
    y += 8;
  });

  doc.save("Jain_Janganna_2026.pdf");

  alert("जय जिनेन्द्र 🙏\nफॉर्म सफलतापूर्वक जमा हुआ।");

});

</script>

</body>
</html>
