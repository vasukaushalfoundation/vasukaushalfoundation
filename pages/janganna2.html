<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>जैन जनगणना प्रपत्र 2026</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f9;}
.header{
background:linear-gradient(45deg,#7a0000,#b30000);
color:white;
padding:30px;
text-align:center;
line-height:1.8;
}
.container{
max-width:1000px;
margin:30px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
.section-title{
margin-top:30px;
font-weight:bold;
color:#800000;
border-bottom:2px solid #800000;
padding-bottom:5px;
}
label{font-weight:bold;margin-top:10px;display:block;}
input, select, textarea{
width:100%;
padding:8px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}
button{
background:#800000;
color:white;
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:15px;
}
.member-block{
border:1px solid #ddd;
padding:15px;
margin-top:15px;
border-radius:8px;
background:#fafafa;
position:relative;
}
.remove-btn{
background:red;
position:absolute;
right:10px;
top:10px;
padding:5px 8px;
font-size:12px;
}
.footer{
background:#222;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}
.footer a{color:#ffd700;text-decoration:none;font-weight:bold;}
</style>
</head>

<body>

<div class="header">
<h1>जैन जनगणना प्रपत्र 2026</h1>
कृपया परिवार के सभी सदस्यों की जानकारी फॉर्म में भरें।
</div>

<div class="container">

<form id="familyForm">

<div class="section-title">परिवार सदस्य विवरण</div>
<div id="members"></div>
<button type="button" onclick="addMember()">+ सदस्य जोड़ें</button>

<button type="submit">प्रपत्र जमा करें</button>

</form>
</div>

<script>
let memberCount=0;

function addMember(){
memberCount++;

let div=document.createElement("div");
div.className="member-block";

let donationField="";

// ✅ सिर्फ पहले सदस्य के लिए दान राशि दिखेगी
if(memberCount===1){
donationField=`
<label>दान राशि (रुपये प्रतिमाह)</label>
<input type="number" class="memberDonation">
`;
}

div.innerHTML=`
<b>सदस्य ${memberCount}</b>
<button type="button" class="remove-btn" onclick="this.parentElement.remove();updateNumbering()">X</button>

<label>नाम</label>
<input required>

<label>पिता/पति का नाम</label>
<input>

<label>लिंग</label>
<select required>
<option value="">-- चयन करें --</option>
<option>पुरुष</option>
<option>महिला</option>
<option>अन्य</option>
</select>

<label>जन्मतिथि</label>
<input type="date" required>

${donationField}

<label>मोबाइल</label>
<input type="tel">
`;

document.getElementById("members").appendChild(div);
}

function updateNumbering(){
memberCount=0;
document.querySelectorAll(".member-block").forEach((b,index)=>{
memberCount++;
b.querySelector("b").innerText="सदस्य "+memberCount;

// ❗ अगर पहला सदस्य हट गया तो नए पहले में donation जोड़ दो
if(index===0 && !b.querySelector(".memberDonation")){
let donationHTML=`
<label>दान राशि (रुपये प्रतिमाह)</label>
<input type="number" class="memberDonation">
`;
b.insertAdjacentHTML("beforeend", donationHTML);
}

// बाकी सदस्यों से donation हटा दो
if(index!==0){
let donation=b.querySelector(".memberDonation");
if(donation){
donation.parentElement.removeChild(donation.previousElementSibling);
donation.remove();
}
}
});
}

window.onload=addMember;

document.getElementById("familyForm").addEventListener("submit", function(e){
e.preventDefault();

let members=[];

document.querySelectorAll(".member-block").forEach((block,index)=>{
let inputs=block.querySelectorAll("input, select");

let donation="";
if(index===0){
let d=block.querySelector(".memberDonation");
donation=d?d.value:"";
}

members.push({
name: inputs[0].value,
father: inputs[1].value,
gender: inputs[2].value,
dob: inputs[3].value,
mobile: inputs[4]?inputs[4].value:"",
donation: donation
});
});

console.log(members);
alert("प्रपत्र सफलतापूर्वक जमा हो गया ✅");
});
</script>

</body>
</html>
