<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>जैन जनगणना प्रपत्र 2026</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f5f1e6; padding:20px;}
.container { max-width:900px; margin:auto; background:white; padding:25px; border-radius:10px;}
h1 { text-align:center; color:#8B0000; }

input, select { width:100%; padding:8px; margin:6px 0; }

button {
  background:#8B0000;
  color:white;
  padding:10px;
  border:none;
  cursor:pointer;
  margin-top:8px;
}

.member-block {
  border:1px solid #ccc;
  padding:15px;
  margin-bottom:15px;
  border-radius:6px;
  background:#fafafa;
  position:relative;
}

.remove-btn {
  background:red;
  position:absolute;
  right:10px;
  top:10px;
  padding:5px 8px;
  font-size:12px;
}
.member-title {
  font-weight:bold;
  margin-bottom:10px;
}
</style>
</head>

<body>
<div class="container">

<h1>जैन जनगणना प्रपत्र 2026</h1>

<form id="familyForm">

<label>सम्प्रदाय</label>
<select id="sampraday" required>
<option value="">-- चयन करें --</option>
<option>दिगम्बर</option>
<option>श्वेताम्बर</option>
</select>

<label>गोत्र</label>
<input type="text" id="gotra">

<h3>परिवार सदस्य विवरण</h3>

<div id="members"></div>

<button type="button" onclick="addMember()">+ सदस्य जोड़ें</button>

<button type="submit">प्रपत्र जमा करें</button>

</form>

</div>

<script>

let memberCount = 0;

function addMember(){

  memberCount++;

  var container = document.getElementById("members");

  var div = document.createElement("div");
  div.className = "member-block";

  div.innerHTML = `
    <div class="member-title">सदस्य ${memberCount}</div>
    <button type="button" class="remove-btn" onclick="removeMember(this)">X</button>

    <label>नाम</label>
    <input class="m_name" required>

    <label>पिता/पति का नाम</label>
    <input class="m_father">

    <label>लिंग</label>
    <select class="m_gender">
      <option value="">-- चयन करें --</option>
      <option>पुरुष</option>
      <option>महिला</option>
      <option>अन्य</option>
    </select>

    <label>मोबाइल नंबर</label>
    <input class="m_mobile" required>
  `;

  container.appendChild(div);
}

function removeMember(btn){
  btn.parentElement.remove();
  updateNumbering();
}

function updateNumbering(){
  memberCount = 0;
  document.querySelectorAll(".member-block").forEach(function(block){
    memberCount++;
    block.querySelector(".member-title").innerText = "सदस्य " + memberCount;
  });
}

window.onload = function(){
  addMember();
};

document.getElementById("familyForm").addEventListener("submit", function(e){

  e.preventDefault();

  let allData = [];

  document.querySelectorAll(".member-block").forEach(function(block){

    allData.push({
      sampraday: document.getElementById("sampraday").value,
      gotra: document.getElementById("gotra").value,
      name: block.querySelector(".m_name").value,
      father: block.querySelector(".m_father").value,
      gender: block.querySelector(".m_gender").value,
      mobile: block.querySelector(".m_mobile").value
    });

  });

  // 📊 GOOGLE SHEET SUBMISSION
  fetch("YOUR_GOOGLE_SCRIPT_URL", {
    method:"POST",
    body: JSON.stringify(allData)
  });

  // 📄 AUTO PDF EXPORT
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  let y = 10;
  doc.text("जैन जनगणना प्रपत्र 2026", 10, y);
  y += 10;

  allData.forEach(function(member, index){
    doc.text("सदस्य " + (index+1), 10, y); y+=8;
    doc.text("नाम: " + member.name, 10, y); y+=8;
    doc.text("मोबाइल: " + member.mobile, 10, y); y+=12;
  });

  doc.save("Jain_Janganna_Form.pdf");

  alert("जय जिनेन्द्र 🙏\nफॉर्म सफलतापूर्वक जमा हुआ।");

});

</script>

</body>
</html>
