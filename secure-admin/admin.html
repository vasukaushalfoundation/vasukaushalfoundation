<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jain Census Admin Panel</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:20px;margin:0;}
h2{margin-bottom:20px;}
table{width:100%;border-collapse:collapse;background:white;margin-top:15px;}
th,td{border:1px solid #ccc;padding:8px;font-size:13px;text-align:left;}
th{background:#800000;color:white;}
button{padding:8px 12px;background:#800000;color:white;border:none;margin:5px;cursor:pointer;}
select,input{padding:6px;margin:5px;}
.cardBox{background:white;padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,0.1);min-width:200px;text-align:center;}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:#00ff00;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;}
#matrixCanvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.loader-content{position:relative;z-index:2;text-align:center;}
#terminalText{font-family:monospace;font-size:18px;margin-bottom:20px;white-space:pre-line;}
#percent{font-size:40px;font-weight:bold;}
.filterBox{background:white;padding:15px;border-radius:10px;margin-bottom:15px;}
</style>
</head>

<body>

<h2>Jain Census Admin Dashboard</h2>

<div style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;">
<div class="cardBox"><h3>Total Families</h3><h2 id="totalFamilies">0</h2></div>
<div class="cardBox"><h3>Total Members</h3><h2 id="totalMembers">0</h2></div>
<div class="cardBox"><h3>Birthdays This Month</h3><h2 id="monthBirthdays">0</h2></div>
</div>

<div class="filterBox">
<h3>DOB Range Filter</h3>
From <input type="date" id="dobFrom">
To <input type="date" id="dobTo">
<button onclick="filterDOB()">Apply</button>
<button onclick="resetAll()">Reset</button>
<hr>
<h3>Column Filter</h3>

<select id="columnSelect" onchange="populateValues()">
<option value="">Select Column</option>
</select>

<select id="valueSelect">
<option value="">Select Value</option>
</select>

<button onclick="applyColumnFilter()">Apply Filter</button>
</div>

<div id="tableContainer"></div>

<div id="loadingScreen">
<canvas id="matrixCanvas"></canvas>
<div class="loader-content">
<div id="terminalText"></div>
<div id="percent">0%</div>
</div>
</div>

<script>

let sheetData=[];
let currentData=[];
let dataLoaded=false;
let minTimePassed=false;

window.onload=function(){
setTimeout(()=>{minTimePassed=true;checkLoader();},4000);
loadData();
startMatrix();
startTyping();
startCounter();
};

function checkLoader(){
if(dataLoaded && minTimePassed){
document.getElementById("loadingScreen").style.display="none";
}
}

function loadData(){
fetch("https://script.google.com/macros/s/AKfycbykJHnlG-TazPHuhPF_0IOOy5sV_CeIut0QT9wUQ_REf0Mw-Q_iKo6yIZBdh5TRIqW23A/exec")
.then(res=>res.json())
.then(data=>{
sheetData=data||[];
currentData=sheetData;
populateColumns();
processDashboard(currentData);
renderTable(currentData);
dataLoaded=true;
checkLoader();
})
.catch(()=>{
sheetData=[];
currentData=[];
renderTable([]);
dataLoaded=true;
checkLoader();
});
}

function processDashboard(data){
document.getElementById("totalMembers").innerText=data.length;

let families=new Set();
data.forEach(r=>families.add(Object.values(r)[2]));
document.getElementById("totalFamilies").innerText=families.size;

let month=new Date().getMonth();
let count=0;
data.forEach(r=>{
let dob=Object.values(r)[7];
if(dob){
let d=new Date(dob);
if(!isNaN(d) && d.getMonth()===month) count++;
}
});
document.getElementById("monthBirthdays").innerText=count;
}

function renderTable(data){
if(!data || data.length===0){
document.getElementById("tableContainer").innerHTML="<b>No Data Found</b>";
return;
}
let html="<table><tr>";
Object.keys(data[0]).forEach(k=>html+="<th>"+k+"</th>");
html+="</tr>";
data.forEach(r=>{
html+="<tr>";
Object.values(r).forEach(v=>html+="<td>"+(v||"")+"</td>");
html+="</tr>";
});
html+="</table>";
document.getElementById("tableContainer").innerHTML=html;
}

function populateColumns(){
let col=document.getElementById("columnSelect");
col.innerHTML='<option value="">Select Column</option>';

if(!sheetData || sheetData.length===0) return;

Object.keys(sheetData[0]).forEach((k,i)=>{
let opt=document.createElement("option");
opt.value=i;
opt.text=k;
col.appendChild(opt);
});

document.getElementById("valueSelect").innerHTML='<option value="">Select Value</option>';
}

function populateValues(){
let colIndex=document.getElementById("columnSelect").value;
let valSel=document.getElementById("valueSelect");

valSel.innerHTML='<option value="">Select Value</option>';

if(colIndex==="") return;

let unique=new Set();

sheetData.forEach(r=>{
let v=Object.values(r)[colIndex];
if(v!==undefined && v!==null && v!=="") unique.add(v);
});

Array.from(unique).sort().forEach(v=>{
let opt=document.createElement("option");
opt.value=v;
opt.text=v;
valSel.appendChild(opt);
});
}

function applyColumnFilter(){
let col=document.getElementById("columnSelect").value;
let val=document.getElementById("valueSelect").value;

if(col==="" || val==="") return;

currentData=sheetData.filter(r=>String(Object.values(r)[col])===val);
renderTable(currentData);
processDashboard(currentData);
}

function filterDOB(){
let from=document.getElementById("dobFrom").value;
let to=document.getElementById("dobTo").value;
if(!from||!to) return;
let f=new Date(from);
let t=new Date(to); t.setHours(23,59,59,999);
currentData=sheetData.filter(r=>{
let d=new Date(Object.values(r)[7]);
return !isNaN(d) && d>=f && d<=t;
});
renderTable(currentData);
processDashboard(currentData);
}

function resetAll(){
currentData = sheetData;

document.getElementById("dobFrom").value="";
document.getElementById("dobTo").value="";
document.getElementById("columnSelect").value="";
document.getElementById("valueSelect").innerHTML='<option value="">Select Value</option>';

renderTable(currentData);
processDashboard(currentData);
}

/* Loader Effects same as before */

function startMatrix(){ /* unchanged */ }
function startTyping(){ /* unchanged */ }
function startCounter(){ /* unchanged */ }

</script>
</body>
</html>
