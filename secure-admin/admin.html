<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jain Census Admin Panel</title>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:20px;
margin:0;
}

h2{margin-bottom:20px;}
table{width:100%;border-collapse:collapse;background:white;margin-top:15px;}
th,td{border:1px solid #ccc;padding:8px;font-size:13px;text-align:left;}
th{background:#800000;color:white;}
button{padding:8px 12px;background:#800000;color:white;border:none;margin:5px;cursor:pointer;}
select,input{padding:6px;margin:5px;}

.cardBox{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
min-width:200px;
text-align:center;
cursor:pointer;
}

/* LOADING SCREEN */

#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:#00ff00;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
overflow:hidden;
}

#matrixCanvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.loader-content{
position:relative;
z-index:2;
text-align:center;
}

#terminalText{
font-family:monospace;
font-size:18px;
margin-bottom:20px;
white-space:pre-line;
}

#percent{
font-size:40px;
font-weight:bold;
}
</style>
</head>

<body>

<h2>Jain Census Admin Dashboard</h2>

<div style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;">

<div class="cardBox">
<h3>Total Families</h3>
<h2 id="totalFamilies">0</h2>
</div>

<div class="cardBox">
<h3>Total Members</h3>
<h2 id="totalMembers">0</h2>
</div>

<div class="cardBox">
<h3>Birthdays This Month</h3>
<h2 id="monthBirthdays">0</h2>
</div>

</div>

<div id="tableContainer"></div>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
  <canvas id="matrixCanvas"></canvas>
  <div class="loader-content">
    <div id="terminalText"></div>
    <div id="percent">0%</div>
  </div>
</div>

<script>

/* MATRIX EFFECT */

const canvas = document.getElementById("matrixCanvas");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

let letters = "01";
letters = letters.split("");

let fontSize = 14;
let columns = canvas.width/fontSize;
let drops = [];

for(let x=0;x<columns;x++)
drops[x]=1;

function draw(){
ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#0f0";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){
let text=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0;

drops[i]++;
}
}
setInterval(draw,33);

/* TERMINAL TYPING */

let textLines=[
"Initializing Secure System...",
"Scanning Database...",
"Encrypting Records...",
"Bypassing Firewall...",
"System Ready..."
];

let terminal=document.getElementById("terminalText");
let lineIndex=0;
let charIndex=0;

function typeEffect(){
if(lineIndex<textLines.length){
if(charIndex<textLines[lineIndex].length){
terminal.innerHTML+=textLines[lineIndex].charAt(charIndex);
charIndex++;
setTimeout(typeEffect,40);
}else{
terminal.innerHTML+="\n";
lineIndex++;
charIndex=0;
setTimeout(typeEffect,300);
}
}
}
typeEffect();

/* PERCENT COUNTER */

let percent=0;
let percentDiv=document.getElementById("percent");

let interval=setInterval(()=>{
percent++;
percentDiv.innerText=percent+"%";
if(percent>=100){
clearInterval(interval);
}
},60);

/* AUTO HIDE LOADER */

window.onload=function(){
setTimeout(()=>{
document.getElementById("loadingScreen").style.display="none";
loadData();
},6000);
}

/* LOAD DATA */

let sheetData=[];

function loadData(){
fetch("https://script.google.com/macros/s/AKfycbykJHnlG-TazPHuhPF_0IOOy5sV_CeIut0QT9wUQ_REf0Mw-Q_iKo6yIZBdh5TRIqW23A/exec")
.then(res=>res.json())
.then(data=>{
sheetData=data;
processDashboard(data);
renderTable(data);
});
}

function processDashboard(data){

document.getElementById("totalMembers").innerText=data.length;

let familySet=new Set();
data.forEach(row=>{
familySet.add(Object.values(row)[2]);
});
document.getElementById("totalFamilies").innerText=familySet.size;

let currentMonth=new Date().getMonth();
let birthdayCount=0;

data.forEach(row=>{
let dob=Object.values(row)[7];
if(dob){
let dobDate=new Date(dob);
if(dobDate.getMonth()===currentMonth){
birthdayCount++;
}
}
});
document.getElementById("monthBirthdays").innerText=birthdayCount;
}

function renderTable(data){

if(data.length===0){
document.getElementById("tableContainer").innerHTML="No Data Found";
return;
}

let html="<table><tr>";

Object.keys(data[0]).forEach(key=>{
html+="<th>"+key+"</th>";
});

html+="</tr>";

data.forEach(row=>{
html+="<tr>";
Object.values(row).forEach(val=>{
html+="<td>"+val+"</td>";
});
html+="</tr>";
});

html+="</table>";

document.getElementById("tableContainer").innerHTML=html;
}

</script>

</body>
</html>
