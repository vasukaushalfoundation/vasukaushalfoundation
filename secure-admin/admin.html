<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:20px;}
table{width:100%;border-collapse:collapse;background:white;}
th,td{border:1px solid #ccc;padding:8px;font-size:13px;}
th{background:#800000;color:white;}
button{padding:8px 12px;background:#800000;color:white;border:none;margin-bottom:15px;}
</style>

</head>
<body>

<h2>Jain Census Admin Dashboard</h2>

<div style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;">

<div class="cardBox">
<h3>Total Families</h3>
<h2 id="totalFamilies">0</h2>
</div>

<div class="cardBox">
<h3>Total Members</h3>
<h2 id="totalMembers">0</h2>
</div>

<div class="cardBox">
<h3>Total Districts</h3>
<h2 id="totalDistricts">0</h2>
</div>

<div class="cardBox">
<h3>Birthdays This Month</h3>
<h2 id="monthBirthdays">0</h2>
</div>

</div>

<div id="locationWise"></div>

<hr>

<button onclick="downloadCSV()">Download CSV</button>

<div id="tableContainer"></div>

<style>
.cardBox{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
min-width:200px;
text-align:center;
}
</style>

<script>

let sheetData = [];

window.onload = function(){
loadData();
}

function loadData(){

fetch("https://script.google.com/macros/s/AKfycbykJHnlG-TazPHuhPF_0IOOy5sV_CeIut0QT9wUQ_REf0Mw-Q_iKo6yIZBdh5TRIqW23A/exec")
.then(res=>res.json())
.then(data=>{
  sheetData = data;
  processDashboard(data);
  renderTable(data);
});

}

function processDashboard(data){

// Total Members
document.getElementById("totalMembers").innerText = data.length;

// Total Families (unique Family ID column index 2)
let familySet = new Set();
data.forEach(row=>{
familySet.add(Object.values(row)[2]);
});
document.getElementById("totalFamilies").innerText = familySet.size;

// Location wise (District column index 12)
let districtCount = {};
data.forEach(row=>{
let district = Object.values(row)[12];
districtCount[district] = (districtCount[district] || 0) + 1;
});

document.getElementById("totalDistricts").innerText = Object.keys(districtCount).length;

// Show location wise breakdown
let locHTML = "<h3>Location Wise Members</h3><ul>";
for(let d in districtCount){
locHTML += `<li>${d} : ${districtCount[d]}</li>`;
}
locHTML += "</ul>";

document.getElementById("locationWise").innerHTML = locHTML;

// Current Month Birthdays (DOB column index 7)
let currentMonth = new Date().getMonth();
let birthdayCount = 0;

data.forEach(row=>{
let dob = Object.values(row)[7];
if(dob){
let dobDate = new Date(dob);
if(dobDate.getMonth() === currentMonth){
birthdayCount++;
}
}
});

document.getElementById("monthBirthdays").innerText = birthdayCount;

}

function renderTable(data){

if(data.length===0){
document.getElementById("tableContainer").innerHTML="No Data Found";
return;
}

let html="<table><tr>";

Object.keys(data[0]).forEach(key=>{
html+="<th>"+key+"</th>";
});

html+="</tr>";

data.forEach(row=>{
html+="<tr>";
Object.values(row).forEach(val=>{
html+="<td>"+val+"</td>";
});
html+="</tr>";
});

html+="</table>";

document.getElementById("tableContainer").innerHTML=html;

}

function downloadCSV(){

let csv="";
let headers=Object.keys(sheetData[0]);

csv+=headers.join(",")+"\n";

sheetData.forEach(row=>{
csv+=Object.values(row).join(",")+"\n";
});

let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="jain_census_data.csv";
a.click();

}

</script>

</body>
</html>
