<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#f4f6f9;
    }
    .header{
      background:#800000;
      color:white;
      padding:15px 20px;
      font-size:18px;
    }
    .dashboard{
      display:flex;
      gap:20px;
      padding:20px;
    }
    .card{
      flex:1;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
      text-align:center;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:white;
    }
    th,td{
      border:1px solid #ccc;
      padding:6px;
      font-size:13px;
    }
    th{
      background:#800000;
      color:white;
    }
  </style>
</head>

<body>

<div class="header">
Secure Jain Census Admin Dashboard
</div>

<div class="dashboard">
  <div class="card">
    <h3>Total Families</h3>
    <h2 id="familyCount">0</h2>
  </div>
  <div class="card">
    <h3>Total Members</h3>
    <h2 id="memberCount">0</h2>
  </div>
</div>

<div style="padding:20px;">
  <div id="tableContainer"></div>
</div>

<script>

google.script.run.withSuccessHandler(function(data){

let families={};

data.forEach(row=>{
let fam=row[2]; // Family ID column index
if(!families[fam]) families[fam]=[];
families[fam].push(row);
});

document.getElementById("familyCount").innerText =
Object.keys(families).length;

document.getElementById("memberCount").innerText =
data.length;

let html="<table><tr>";

data[0].forEach((h)=>{
html+="<th>"+h+"</th>";
});

html+="</tr>";

data.forEach(row=>{
html+="<tr>";
row.forEach(col=>{
html+="<td>"+col+"</td>";
});
html+="</tr>";
});

html+="</table>";

document.getElementById("tableContainer").innerHTML=html;

}).getSheetData();

</script>

</body>
</html>
