<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jain Census Admin Panel</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:20px;margin:0;}
h2{margin-bottom:20px;}
table{width:100%;border-collapse:collapse;background:white;margin-top:15px;}
th,td{border:1px solid #ccc;padding:8px;font-size:13px;text-align:left;}
th{background:#800000;color:white;}
button{padding:8px 12px;background:#800000;color:white;border:none;margin:5px;cursor:pointer;}
select,input{padding:6px;margin:5px;}

.cardBox{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
min-width:200px;
text-align:center;
cursor:pointer;
}

#activeFilters span{
background:#800000;
color:white;
padding:6px 12px;
margin:5px;
display:inline-block;
border-radius:20px;
cursor:pointer;
font-size:13px;
}

/* LOADER */

#loadingScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:#00ff00;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
overflow:hidden;
}

#matrixCanvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.loader-content{
position:relative;
z-index:2;
text-align:center;
}

#terminalText{
font-family:monospace;
font-size:18px;
margin-bottom:20px;
white-space:pre-line;
}

#percent{
font-size:40px;
font-weight:bold;
}
</style>
</head>

<body>

<h2>Jain Census Admin Dashboard</h2>

<div style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;">

<div class="cardBox">
<h3>Total Families</h3>
<h2 id="totalFamilies">0</h2>
</div>

<div class="cardBox">
<h3>Total Members</h3>
<h2 id="totalMembers">0</h2>
</div>

<div class="cardBox" onclick="filterCurrentMonthBirthdays()">
<h3>Birthdays This Month</h3>
<h2 id="monthBirthdays">0</h2>
</div>

</div>

<hr>

<h3>DOB Range Filter</h3>
From: <input type="date" id="dobFrom">
To: <input type="date" id="dobTo">
<button onclick="filterDOBRange()">Apply DOB Filter</button>

<hr>

<h3>Smart Filters</h3>

<select id="filterType" onchange="populateOptions()">
<option value="">Select Filter Type</option>
</select>

<select id="filterValue">
<option value="">Select Option</option>
</select>

<button onclick="addFilter()">Add Filter</button>
<button onclick="resetFilters()">Reset</button>
<button onclick="downloadCSV()">Download CSV</button>

<div id="activeFilters"></div>
<div id="tableContainer"></div>

<!-- LOADER -->
<div id="loadingScreen">
<canvas id="matrixCanvas"></canvas>
<div class="loader-content">
<div id="terminalText"></div>
<div id="percent">0%</div>
</div>
</div>

<script>

let dataLoaded=false;
let minTimePassed=false;
let sheetData=[];
let currentData=[];
let activeFilters=[];

window.onload=function(){

setTimeout(()=>{
minTimePassed=true;
checkLoader();
},8000);

loadData();
startMatrix();
startTyping();
startCounter();
};

function checkLoader(){
if(dataLoaded && minTimePassed){
document.getElementById("loadingScreen").style.display="none";
}
}

function loadData(){
fetch("YOUR_GOOGLE_SCRIPT_URL_HERE")
.then(res=>res.json())
.then(data=>{
sheetData=data;
currentData=data;
populateFilterTypes();
processDashboard(data);
renderTable(data);
dataLoaded=true;
checkLoader();
});
}

/* DASHBOARD */

function processDashboard(data){
document.getElementById("totalMembers").innerText=data.length;

let familySet=new Set();
data.forEach(row=>{
familySet.add(Object.values(row)[2]);
});
document.getElementById("totalFamilies").innerText=familySet.size;

let currentMonth=new Date().getMonth();
let birthdayCount=0;

data.forEach(row=>{
let dob=Object.values(row)[7];
if(dob){
let dobDate=new Date(dob);
if(dobDate.getMonth()===currentMonth){
birthdayCount++;
}
}
});
document.getElementById("monthBirthdays").innerText=birthdayCount;
}

/* FILTERS */

function populateFilterTypes(){
let select=document.getElementById("filterType");
select.innerHTML='<option value="">Select Filter Type</option>';

Object.keys(sheetData[0]).forEach((key,index)=>{
let opt=document.createElement("option");
opt.value=index;
opt.text=key;
select.appendChild(opt);
});
}

function populateOptions(){
let col=document.getElementById("filterType").value;
let dropdown=document.getElementById("filterValue");
dropdown.innerHTML='<option value="">Select Option</option>';
if(col==="") return;

let unique=new Set();
sheetData.forEach(row=>{
let val=Object.values(row)[col];
if(val) unique.add(val);
});

[...unique].sort().forEach(val=>{
let opt=document.createElement("option");
opt.value=val;
opt.text=val;
dropdown.appendChild(opt);
});
}

function addFilter(){
let col=document.getElementById("filterType").value;
let val=document.getElementById("filterValue").value;
if(col===""||val==="") return;

activeFilters.push({col,val});
applyAllFilters();
renderActiveFilters();
}

function renderActiveFilters(){
let container=document.getElementById("activeFilters");
container.innerHTML="";
activeFilters.forEach((f,i)=>{
let chip=document.createElement("span");
chip.innerText=f.val+" ✖";
chip.onclick=function(){
activeFilters.splice(i,1);
applyAllFilters();
renderActiveFilters();
}
container.appendChild(chip);
});
}

function applyAllFilters(){
let filtered=sheetData.filter(row=>{
return activeFilters.every(f=>{
return String(Object.values(row)[f.col]).toLowerCase()===f.val.toLowerCase();
});
});
currentData=filtered;
renderTable(filtered);
processDashboard(filtered);
}

function filterDOBRange(){
let from=document.getElementById("dobFrom").value;
let to=document.getElementById("dobTo").value;
if(!from||!to){alert("Select both dates");return;}

let fromDate=new Date(from);
let toDate=new Date(to);
toDate.setHours(23,59,59,999);

let filtered=sheetData.filter(row=>{
let dob=Object.values(row)[7];
if(!dob) return false;
let d=new Date(dob);
return d>=fromDate && d<=toDate;
});
currentData=filtered;
renderTable(filtered);
processDashboard(filtered);
}

function filterCurrentMonthBirthdays(){
let currentMonth=new Date().getMonth();
let filtered=sheetData.filter(row=>{
let dob=Object.values(row)[7];
if(!dob) return false;
let d=new Date(dob);
return d.getMonth()===currentMonth;
});
currentData=filtered;
renderTable(filtered);
processDashboard(filtered);
}

function resetFilters(){
activeFilters=[];
currentData=sheetData;
document.getElementById("activeFilters").innerHTML="";
document.getElementById("dobFrom").value="";
document.getElementById("dobTo").value="";
renderTable(sheetData);
processDashboard(sheetData);
}

/* TABLE */

function renderTable(data){
if(data.length===0){
document.getElementById("tableContainer").innerHTML="No Data Found";
return;
}
let html="<table><tr>";
Object.keys(data[0]).forEach(key=>{
html+="<th>"+key+"</th>";
});
html+="</tr>";
data.forEach(row=>{
html+="<tr>";
Object.values(row).forEach(val=>{
html+="<td>"+val+"</td>";
});
html+="</tr>";
});
html+="</table>";
document.getElementById("tableContainer").innerHTML=html;
}

function downloadCSV(){
if(currentData.length===0){alert("No Data");return;}
let csv="";
let headers=Object.keys(currentData[0]);
csv+=headers.join(",")+"\n";
currentData.forEach(row=>{
csv+=Object.values(row).join(",")+"\n";
});
let blob=new Blob([csv],{type:"text/csv"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="filtered_data.csv";
a.click();
}

/* MATRIX + TERMINAL + COUNTER SAME AS BEFORE */

function startMatrix(){ /* same matrix code */ }
function startTyping(){ /* same typing code */ }
function startCounter(){ /* same counter code */ }

</script>

</body>
</html>
